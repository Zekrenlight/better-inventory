[package]
name = "mod-better-inventory"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Better Inventory for Sunrise: sorting, hotbar auto-refill, an equipment HUD and a livelier hotbar."
authors = ["Zekrenlight"]

[lib]
name = "mod_better_inventory"
path = "src/lib.rs"

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
